name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # gitleaks — full-history secret scan on EVERY pull request, via the shared
  # brick in hseshadr/ci. It runs at the PR because a secret is the one defect
  # you cannot fix by reverting: once a credential lands in this public history
  # it is burned, and a revert only hides it from HEAD.
  #
  # The brick checks out with fetch-depth: 0 and scans every commit, not just
  # the diff. This repo ships no .gitleaks.toml; the default ruleset applies.
  gitleaks:
    name: Secret scan
    # The reusable workflow lists a PR's commits over the API, which needs
    # pull-requests: read. The workflow-level `contents: read` does not grant it,
    # and a caller job may raise a scope the read-only top level withholds.
    permissions:
      contents: read
      pull-requests: read
    # Pinned to a 40-char commit SHA, not `@ci-v3`: a tag can be repointed at new
    # code, and this job runs with this repo's token. The trailing comment names
    # the EXACT release so Dependabot bumps pin and comment together — a floating
    # `# ci-v3` would silently go wrong the moment upstream moves that tag.
    # `ci-v3.2.1` is an ANNOTATED tag: refs/tags/ci-v3.2.1 is tag object
    # edbd737de70ba1bc1b135353fe15e595d371e701, whose commit is the SHA below.
    # Pinning is transitive and holds here: at this SHA the brick's own two
    # `uses:` refs (actions/checkout, gitleaks/gitleaks-action) are both SHAs.
    uses: hseshadr/ci/.github/workflows/secret-scan.yml@a895f726e9786bcfd2bdf68f87d3d5c4b411f702 # ci-v3.2.1

  gate:
    runs-on: ubuntu-latest
    steps:
      # Every `uses:` below names a full 40-char commit SHA, not a moving tag. A
      # tag can be repointed at new code; a SHA cannot. The trailing comment
      # records which release that SHA is, so Dependabot's `github-actions`
      # ecosystem bumps both the pin and the comment.
      # test/workflow-security.test.ts enforces this and can fail — it is paired
      # with accept/reject cases so the RULE is proven, not just applied.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate never pushes, so leaving the token in .git/config would only
          # widen what a compromised step can reach.
          persist-credentials: false

      - name: Install pnpm
        # Version comes from package.json "packageManager" — one pin, no drift.
        # The comment names the EXACT release, not `# v6`: a floating major on an
        # immutable SHA is the pattern that turned hseshadr/ci main red on
        # 2026-08-03 with no commit in the repo. This SHA is v6.0.9.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # dangerously-allow-all-builds lets the trusted toolchain binaries
        # (biome, esbuild) build non-interactively in CI.
        run: pnpm install --frozen-lockfile --config.dangerously-allow-all-builds=true

      - name: Gate (the exact local command — CI mirrors the gate)
        # lint -> typecheck -> BUILD -> test. The build comes before the tests on
        # purpose: test/dist-contract.test.ts inspects real build output, because
        # `files: ["dist"]` means consumers get only that, and a claim that holds
        # in src/ and fails in dist/ is invisible to every source-level test.
        run: pnpm gate

  browser:
    name: Chromium (Worker + OPFS + sqlite-vector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerously-allow-all-builds=true

      - name: Install pinned Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prove Worker, sqlite-vector, and OPFS persistence
        run: pnpm test:browser
