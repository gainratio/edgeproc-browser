name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # gitleaks — full-history secret scan on EVERY pull request. It runs at the PR
  # because a secret is the one defect you cannot fix by reverting: once a
  # credential lands in this public history it is burned, and a revert only
  # hides it from HEAD.
  #
  # This job is a faithful inline copy of the job in gainratio/ci's reusable
  # secret-scan.yml at ci-v3.3.0 (8166345), the last release that shipped it:
  # ci retired its reusable catalog (7c75ff1). One addition: gainratio is an
  # ORGANIZATION, and gitleaks-action refuses to scan an org repo without a
  # license, so the action step reads the org secret GITLEAKS_LICENSE.
  #
  # gitleaks-action on its own scans only the commits the event introduced (a
  # push already on main scans zero). The last step adds an explicit pass over
  # every commit. This repo ships no .gitleaks.toml; the default ruleset applies.
  gitleaks:
    name: Secret scan / gitleaks
    # gitleaks-action lists a PR's commits over the API, which needs
    # pull-requests: read. The workflow-level `contents: read` does not grant it.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Makes BASE^ resolvable for the push/PR range and lets the full-history
          # pass reach every commit. It does NOT by itself widen the action's range.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Findings stay in this job's redacted logs. Never copy a detected
          # credential into a PR comment, summary, or downloadable SARIF artifact.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"
      - name: Enforce full-history scan coverage
        run: |
          commits="$(git rev-list --count HEAD 2>/dev/null || echo '?')"
          gitleaks git --redact --no-banner --log-opts="--all" .
          echo "gitleaks swept FULL HISTORY: all ${commits} commits."

  gate:
    runs-on: ubuntu-latest
    steps:
      # Every `uses:` below names a full 40-char commit SHA, not a moving tag. A
      # tag can be repointed at new code; a SHA cannot. The trailing comment
      # records which release that SHA is, so Dependabot's `github-actions`
      # ecosystem bumps both the pin and the comment.
      # test/workflow-security.test.ts enforces this and can fail — it is paired
      # with accept/reject cases so the RULE is proven, not just applied.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate never pushes, so leaving the token in .git/config would only
          # widen what a compromised step can reach.
          persist-credentials: false

      - name: Install pnpm
        # Version comes from package.json "packageManager" — one pin, no drift.
        # The comment names the EXACT release, not `# v6`: a floating major on an
        # immutable SHA is the pattern that turned gainratio/ci main red on
        # 2026-08-03 with no commit in the repo. This SHA is v6.0.9.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # dangerously-allow-all-builds lets the trusted toolchain binaries
        # (biome, esbuild) build non-interactively in CI.
        run: pnpm install --frozen-lockfile --config.dangerously-allow-all-builds=true

      - name: Gate (the exact local command — CI mirrors the gate)
        # lint -> typecheck -> BUILD -> test. The build comes before the tests on
        # purpose: test/dist-contract.test.ts inspects real build output, because
        # `files: ["dist"]` means consumers get only that, and a claim that holds
        # in src/ and fails in dist/ is invisible to every source-level test.
        run: pnpm gate

      - name: Verify committed dist/ matches src/
        # The gate's verify:dist sees modified and new files, but tsc never
        # deletes outputs, so a stale file left in dist/ by a removed source
        # would pass. Rebuilding into an EMPTY dist/ turns it into a deletion.
        run: |
          rm -rf dist
          pnpm build
          pnpm verify:dist

  browser:
    # The name is a required status check on main; it now also covers Firefox
    # and WebKit (cross-browser.spec.ts). Renaming it would orphan that check.
    name: Chromium (Worker + OPFS + sqlite-vector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerously-allow-all-builds=true

      - name: Install pinned Playwright Chromium, Firefox and WebKit
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Prove Worker, sqlite-vector, OPFS (or its typed fallback) in three engines
        # Chromium runs every spec. Firefox and WebKit run cross-browser.spec.ts:
        # OPFS open, the typed memory fallback, the SQL round trip,
        # export/import and MemoryProfile detection without deviceMemory.
        run: pnpm test:browser

  # PUBLISH PATH — the exact command chain publish.yml runs, minus the upload.
  # 0.3.0's tag failed here and nowhere else: ts-publish.yml installs
  # npm@latest (12.x) just before `npm publish`, while `gate` above runs the
  # npm bundled with Node 24 (11.x). npm 12 changed `npm pack --json` from an
  # array to an object keyed by name, the packed-tarball test read `[]`, and
  # the publish died on a tarball that was fine. So this job mirrors that
  # environment (registry .npmrc, npm@latest) and runs `npm publish --dry-run`,
  # which fires prepublishOnly = `preflight && gate` under the same npm, from
  # inside an npm lifecycle, exactly as the real publish does.
  publish-path:
    name: Publish path (npm@latest, prepublishOnly, dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node (registry .npmrc, as ts-publish.yml writes it)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerously-allow-all-builds=true

      - name: Use the publish job's npm (npm@latest, as ts-publish.yml does)
        run: npm install --global npm@latest && npm --version

      - name: npm publish --dry-run (runs prepublishOnly = preflight && gate)
        run: npm publish --dry-run --access public
