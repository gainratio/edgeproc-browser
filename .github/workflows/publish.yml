# edgeproc-browser — .github/workflows/publish.yml
#
# npm release of `@gainratio/browser` via OIDC Trusted Publishing. Pushing a `v*` tag is the
# whole trigger. There is NO npm write token in this repository, and there must never be one:
# the credential is a short-lived OIDC token GitHub mints for this job, which npm verifies
# against a trusted publisher registered as {gainratio, edgeproc-browser, publish.yml}.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# READ THIS BEFORE THE FIRST RELEASE — the first publish CANNOT use this rail.
# ─────────────────────────────────────────────────────────────────────────────────────────
# npm has no "pending publisher". A trusted publisher is attached to an EXISTING package, so
# a name that has never been published has nothing to attach it to. This is a fact about npm,
# not a gap in this workflow, and no amount of retrying a tag push will get around it.
#
# So the name is claimed ONCE by hand with a throwaway placeholder, `0.0.0-bootstrap.0` under
# the `bootstrap` dist-tag (ops/npm_gainratio_bootstrap.py does this for every @gainratio
# package), and the trusted publisher is registered against that:
#        npm trust github @gainratio/browser --file publish.yml \
#          --repo gainratio/edgeproc-browser --allow-publish
# It prompts for a security-key tap via a URL. `npm access` does NOT cover trusted publishers.
# Every real version, starting with 0.1.1, is then a `v*` tag push through here, with
# provenance. (0.1.0, under the old @edgeproc scope, was published by hand and has none.)
#
# Branch protection LAST, and only while the repo has 0 open PRs: protecting with PRs open
# leaves each one BLOCKED with no way to self-approve.
#
# Two more npm truths the publish job encodes:
#   * Re-tagging v0.1.0 just 403s. The next release must carry a HIGHER version.
#   * `package.json` `repository.url` MUST match this GitHub repo exactly or the OIDC publish
#     fails with ENEEDAUTH. It does: git+https://github.com/gainratio/edgeproc-browser.git
#
# INLINE, NOT CENTRAL. The publish job used to call gainratio/ci's reusable
# ts-publish.yml. That brick nested an `hseshadr/ci/...` action ref, and GitHub
# does not redirect `uses:` for a moved repo, so the next tag would have failed
# before publishing. gainratio/ci has also retired the catalog (7c75ff1). The job
# below is a faithful copy of the ci-v3.3.0 brick. Every `uses:` is pinned to a
# 40-char SHA (this job holds `id-token: write`, so a mutable ref anywhere in the
# chain reaches npm); `test/workflow-security.test.ts` fails the gate otherwise.
name: Publish (npm, OIDC)

on:
  push:
    tags: ["v*"]

# Top-level is read-only. The OIDC scope is granted on the publish job alone — a top-level
# scope applies to every job in the file, including ones added later that have no business
# minting a token.
permissions:
  contents: read

jobs:
  # RELEASE GATE — fail closed before anything can mint an npm credential.
  # 0.2.1 shipped from a commit whose CI on main was red: a tag push alone was
  # enough. scripts/verify-release-tag.mjs (unit-tested in
  # test/release-gate.test.ts) refuses unless the tag equals `v` + package.json's
  # version, the tagged commit is on main, and the newest ci.yml push run for
  # that exact SHA concluded success. If CI was still running when you tagged,
  # re-run this workflow once CI is green; never re-tag to get around it.
  #
  # LIMIT, stated plainly: a tag push runs THIS FILE AS IT IS AT THE TAGGED
  # COMMIT. A tag on an unreviewed side-branch commit can delete this job, and
  # no in-repo check can stop that, because any check lives in the file being
  # edited. What a workflow edit cannot remove lives in repo settings:
  #   * a tag ruleset so only admins can create/move/delete `v*` tags, and
  #   * the `npm-release` environment below, with a required reviewer and a
  #     `v*` tag deployment policy, plus npm's trusted publisher bound to that
  #     environment (`npm trust github ... --environment npm-release`).
  # Without those settings, this gate stops mistakes, not a malicious tag.
  release-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read # compare main...sha
      actions: read # list ci.yml runs for the tagged SHA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches package.json, commit is on main, CI is green
        run: node scripts/verify-release-tag.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  publish:
    needs: release-gate
    runs-on: ubuntu-latest
    # The protected environment the publish runs in (see release-gate above).
    environment: npm-release
    permissions:
      id-token: write # OIDC — this token IS the npm credential. Nothing else may hold it.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # registry-url writes the .npmrc the OIDC exchange needs.
      - name: Setup Node (registry .npmrc for OIDC)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Mirrors ci.yml exactly. allow-all-builds lets the trusted toolchain binaries (biome,
      # esbuild) run their postinstall non-interactively; without it pnpm blocks and the
      # install hangs rather than failing loudly.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerously-allow-all-builds=true

      # The gate is lint -> typecheck -> build -> vitest (with the dist-contract spec reading
      # real build output), no browser dependency, so re-running it from the TAGGED ref is
      # cheap and is the only thing that proves the artefact being published is the artefact
      # that passed.
      - name: Gate
        run: pnpm gate

      - name: Build
        run: pnpm build

      # OIDC needs npm >= 11.5.1; Node 24's bundled npm may be older. The ad-hoc install is
      # deliberate — npm bootstraps itself and has no lockfile here.
      - name: Ensure OIDC-capable npm
        run: npm install --global npm@latest # zizmor: ignore[adhoc-packages] npm >= 11.5.1 required for OIDC; bootstraps the publish CLI, no lockfile applies

      # No write token -> npm publishes via OIDC Trusted Publishing. --provenance requires a
      # PUBLIC repo, which this is.
      - name: Publish to npm (OIDC Trusted Publishing)
        run: npm publish --access public --provenance

      # A green `npm publish` is not the same fact as "the registry serves it". Its PyPI
      # twin let six green publish runs stack up on a package that 404'd. Ask the registry.
      # Bound: 600s of backoff, 3x the slowest propagation measured for this portfolio
      # (~200s, first publish of a new npm name). A timeout is a FAILURE, never a pass.
      - name: Verify the release is actually on npm
        run: |
          name="$(npm pkg get name | tr -d '"')"
          version="$(npm pkg get version | tr -d '"')"
          if [[ -z "$name" || -z "$version" || "$name" == "undefined" || "$version" == "undefined" ]]; then
            echo "::error::Could not read name/version from package.json — cannot verify the publish."
            exit 1
          fi
          delays=(5 10 15 30 60 60 60 60 60 60 60 60 60) # 13 sleeps, exactly 600s
          attempts=$((${#delays[@]} + 1))
          for ((i = 0; i < attempts; i++)); do
            if npm view "${name}@${version}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "Verified: ${name}@${version} is live on npm."
              exit 0
            fi
            if ((i < ${#delays[@]})); then
              echo "Attempt $((i + 1))/${attempts}: not served yet; retrying in ${delays[i]}s..."
              sleep "${delays[i]}"
            fi
          done
          echo "::error::PUBLISH VERIFICATION FAILED — npm publish reported success, but the registry does not serve ${name}@${version} after ~10 minutes. Either it is still propagating (run 'npm view ${name}@${version} version' yourself) or the release never happened (check the trusted publisher for gainratio/edgeproc-browser + publish.yml + npm-release). Do not re-run this job merely to make it green."
          exit 1
