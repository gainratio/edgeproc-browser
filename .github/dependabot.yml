# Weekly grouped dependency PRs: one PR per ecosystem per run, so updates
# arrive as a single reviewable PR instead of one PR per dependency.
#   - npm            : the pnpm workspace (package.json, pnpm-lock.yaml)
#   - github-actions : the workflows under .github/workflows/
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
