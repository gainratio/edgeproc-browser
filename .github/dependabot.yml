# Weekly grouped dependency PRs: one PR per ecosystem per run, so updates
# arrive as a single reviewable PR instead of one PR per dependency.
#   - npm            : the pnpm workspace (package.json, pnpm-lock.yaml)
#   - github-actions : the workflows under .github/workflows/
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # hseshadr/ci retired its reusable-workflow catalog (7c75ff1); ci-v3.3.0 is
    # the last release that ships secret-scan.yml and ts-publish.yml. Dependabot
    # otherwise bumps these pins to the default-branch tip, where both files are
    # deleted, and CI fails before any job starts. Move off them deliberately.
    ignore:
      - dependency-name: "hseshadr/ci*"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
