# Monthly grouped dependency PRs: one PR per ecosystem per run, so updates
# arrive as a single reviewable PR instead of one PR per dependency. Only
# minor+patch, after a 7-day cooldown. Semver-major updates are ignored on
# purpose: majors are migrated by hand in a human-written PR.
#   - npm            : the pnpm workspace (package.json, pnpm-lock.yaml)
#   - github-actions : the workflows under .github/workflows/
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # gainratio/ci (formerly hseshadr/ci) retired its reusable-workflow catalog
    # (7c75ff1); ci-v3.3.0 is the last release that ships ts-publish.yml (the
    # secret scan is now an inline job in ci.yml). Dependabot otherwise bumps the
    # pin to the default-branch tip, where the file is deleted, and CI fails
    # before any job starts. Move off it deliberately. ci moved to the org at the same commit, so both
    # owners stay frozen in case a stale hseshadr ref ever reappears.
    ignore:
      - dependency-name: "hseshadr/ci*"
      - dependency-name: "gainratio/ci*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
